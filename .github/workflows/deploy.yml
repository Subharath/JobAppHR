name: Deploy JobAppHR to Windows Server (IIS)

on:
  push:
    branches: ["main"] # Change to your primary branch name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Changed from windows-latest for appleboy actions support

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish
        run: dotnet publish JobAppHR.csproj -c Release -o ./publish

      - name: Deploy via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "./publish/*"
          target: "C:/inetpub/wwwroot/JobAppHR"
          strip_components: 1 # Remove the 'publish' folder prefix

      - name: Restart IIS Site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            powershell -Command "Import-Module WebAdministration; Restart-WebAppPool -Name 'JobAppHR'"
